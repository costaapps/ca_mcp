default_permissions = "workspace-env-safe"

[permissions.workspace-env-safe]
extends = ":workspace"

[permissions.workspace-env-safe.filesystem]
glob_scan_max_depth = 16

[permissions.workspace-env-safe.filesystem.":workspace_roots"]
"." = "write"

# Bloqueia .env
"**/.env" = "deny"

# Bloqueia nomes .env* que não começam com ponto após .env
"**/.env[!.]*" = "deny"

# Bloqueia .env. e variantes com sufixo diferente de example
"**/.env." = "deny"
"**/.env.[!e]*" = "deny"
"**/.env.e" = "deny"
"**/.env.e[!x]*" = "deny"
"**/.env.ex" = "deny"
"**/.env.ex[!a]*" = "deny"
"**/.env.exa" = "deny"
"**/.env.exa[!m]*" = "deny"
"**/.env.exam" = "deny"
"**/.env.exam[!p]*" = "deny"
"**/.env.examp" = "deny"
"**/.env.examp[!l]*" = "deny"
"**/.env.exampl" = "deny"
"**/.env.exampl[!e]*" = "deny"

# Bloqueia nomes que começam com .env.example,
# mas possuem caracteres adicionais
"**/.env.example?*" = "deny"