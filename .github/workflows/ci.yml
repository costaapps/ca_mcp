name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application and production image
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.8.6@sha256:df764e5c6d6d3fcf4a6c298f9ab52d4e783d34f6dc0347da91933ad7f5f6ebb6
        env:
          MARIADB_ROOT_PASSWORD: mcp_test_password
          MARIADB_DATABASE: mcp_test_control
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Database integration tests
        env:
          MCP_TEST_DB_HOST: 127.0.0.1
          MCP_TEST_DB_PORT: 3306
          MCP_TEST_DB_USER: root
          MCP_TEST_DB_PASSWORD: mcp_test_password
          MCP_TEST_DB_ALLOW_CREATE_DROP: YES
        run: npm run test:database

      - name: Compose configuration contract tests
        run: bash ops/ci/test-compose-config.sh

      - name: Release publisher and artifact contract tests
        run: bash ops/ci/test-release-publish.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build production image for smoke test
        env:
          IMAGE: eduardomatuellacostaapps/ca:mcp-${{ github.run_number }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "$IMAGE" \
            --build-arg "OCI_VERSION=$VERSION" \
            --build-arg "OCI_REVISION=$GITHUB_SHA" \
            --build-arg "OCI_RUN=$GITHUB_RUN_NUMBER" \
            .

      - name: Smoke test production image against disposable services
        env:
          IMAGE: eduardomatuellacostaapps/ca:mcp-${{ github.run_number }}
          MCP_TEST_DB_HOST: 127.0.0.1
          MCP_TEST_DB_PORT: 3306
          MCP_TEST_DB_USER: root
          MCP_TEST_DB_PASSWORD: mcp_test_password
          MCP_TEST_DB_ALLOW_CREATE_DROP: YES
        run: npx tsx ops/ci/image-smoke.ts "$IMAGE"

